plugins {
    alias(libs.plugins.shadow) apply false
}

def buildNumber = findProperty('mlsacBuild')
ext.mlsacVersion = buildNumber ? "2.0.${buildNumber}" : '2.0.dev'
ext.mlsacEdition = gradle.ext.mlsacEdition

subprojects {
    apply plugin: 'java-library'

    group = 'italy.mlsac.net'
    version = rootProject.ext.mlsacVersion

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
        maven { url = 'https://maven.enginehub.org/repo/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all,-processing,-serial,-options', '-parameters']
    }

    tasks.withType(JavaCompile).configureEach {
        if (name != 'compileJava21') {
            options.release = 17
        }
    }

    tasks.register('compileJava21', JavaCompile) {
        description = 'Compiles main sources with --release 21 for the java21 jar.'
        source = sourceSets.main.java
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = layout.buildDirectory.dir('classes/java21/main')
        options.release = 21
    }

    dependencies {
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.launcher
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'mlsac.edition', rootProject.ext.mlsacEdition
        systemProperty 'mlsac.leadInRows', '40'
        maxHeapSize = '512m'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
