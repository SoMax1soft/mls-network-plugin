plugins {
    id 'java-test-fixtures'
}

description = 'MLSAC core: platform, scheduling, packet port, configuration, backend client, presets, messages, contracts'

dependencies {
    compileOnly libs.paper.api
    compileOnly libs.worldguard.bukkit
    compileOnly libs.packetevents.spigot
    compileOnly libs.netty.transport

    testImplementation libs.snakeyaml
    testImplementation libs.packetevents.spigot
    testImplementation libs.netty.transport
    testImplementation libs.paper.api
    testFixturesImplementation libs.snakeyaml
    testFixturesCompileOnly libs.paper.api
}

tasks.withType(Test).configureEach {
    systemProperty 'mlsac.bench', findProperty('bench') ?: 'false'
    if (findProperty('benchPlayers') != null) {
        systemProperty 'mlsac.bench.players', findProperty('benchPlayers')
    }
    systemProperty 'mlsac.wire5.vectors', rootProject.file('../specs/backend/wire-v5-vectors.json').absolutePath
}
